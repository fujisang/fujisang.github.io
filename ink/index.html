<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kizamu — Ink</title>
<meta name="robots" content="noindex">
<script src="/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #fluid { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .bar { position: fixed; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) var(--space-3); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .top { top: 0; }
  .bottom { bottom: 0; }
  a.wordmark { color: var(--ink); text-decoration: none; }
  #fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--space-2); text-align: center; }
  #fallback[hidden] { display: none; }
  @media (max-width: 480px) { .bar { padding: var(--space-2); } }
</style>
</head>
<body>
<canvas id="fluid" aria-label="水面に落ちたインクが広がるアニメーション"></canvas>
<p id="fallback" class="caption" hidden>このブラウザでは表示できません（WebGL2 が必要です）。</p>

<div class="bar top">
  <a class="wordmark" href="/">Kizamu</a>
  <div class="theme-switch" role="group" aria-label="背景">
    <button type="button" data-set-theme="light">白</button>
    <button type="button" data-set-theme="dark">黒</button>
  </div>
</div>
<div class="bar bottom">
  <span class="caption">触れると、インクが落ちます。なぞると水が動きます。</span>
</div>

<script src="fluid.js"></script>
</body>
</html>
